name: ARIES Cycle-Level Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "benchmarks/cycle-level/**"
      - ".github/workflows/aries-cycle-benchmark.yml"

permissions:
  contents: read

jobs:
  build-and-measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
      - name: Configure optimized benchmark
        run: cmake -S benchmarks/cycle-level -B build/cycle-benchmark -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/cycle-benchmark --parallel 2
      - name: Run repeatable cycle-level measurement
        run: |
          mkdir -p reports
          ./build/cycle-benchmark/aries_benchmark --warmup 100000 --iterations 200000 | tee reports/aries-cycle-benchmark.txt
      - name: Validate measurement report
        run: |
          grep -q "Raw timestamp-window distribution" reports/aries-cycle-benchmark.txt
          grep -q "Min:" reports/aries-cycle-benchmark.txt
          grep -q "P50:" reports/aries-cycle-benchmark.txt
          grep -q "P99:" reports/aries-cycle-benchmark.txt
          grep -q "Mean:" reports/aries-cycle-benchmark.txt
          grep -q "does NOT establish sub-nanosecond" reports/aries-cycle-benchmark.txt
      - name: Upload machine-measured report
        uses: actions/upload-artifact@v4
        with:
          name: aries-cycle-level-measured-report
          path: reports/aries-cycle-benchmark.txt
          if-no-files-found: error
          retention-days: 90

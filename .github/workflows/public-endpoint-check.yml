name: ARIES Public Endpoint Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-endpoint-check.yml"
      - "api/main.py"
      - "software/**"
      - "Dockerfile"
      - "render.yaml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  check-public-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Render deployment and validate real native inference
        env:
          ARIES_PUBLIC_BASE_URL: https://aries-tier0-api-6qjh.onrender.com
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          base = os.environ["ARIES_PUBLIC_BASE_URL"].rstrip("/")
          deadline = time.monotonic() + 720
          last_error = "deployment has not returned the native runtime yet"

          def request(path, payload=None, timeout=20):
              data = None if payload is None else json.dumps(payload).encode()
              headers = {"Accept":"application/json"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=headers,
                  method="GET" if data is None else "POST")
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      raw = response.read().decode("utf-8", "replace")
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", "replace")
                  try:
                      body = json.loads(raw) if raw else {}
                  except ValueError:
                      body = {"response_text": raw[:500]}
                  return exc.code, body

          # Render builds asynchronously after a Git push. Don't fail on the old
          # deployment while the new Docker image is still being built.
          while time.monotonic() < deadline:
              try:
                  status, root = request("/")
                  if status == 200 and root.get("api_version") == "1.0.9" and root.get("inference_ready") is True and root.get("native_reasoner_enabled") is True and root.get("native_reasoner_version") == "0.2" and root.get("general_chat_ready") is True and (root.get("local_model_loaded") is True or root.get("general_chat_upstream_configured") is True):
                      break
                  last_error = f"service has not switched to native image yet: {root}"
              except Exception as exc:
                  last_error = type(exc).__name__ + ": " + str(exc)
              print("Waiting for Render deployment:", last_error, flush=True)
              time.sleep(15)
          else:
              raise SystemExit("FAIL: Render native deployment did not become ready within 12 minutes. Last result: " + last_error)

          report = {"target":base, "backend":root.get("backend"), "model_id":root.get("model_id"), "checks":[]}
          for path in ("/health", "/", "/diagnostics", "/v1/models", "/performance"):
              status, body = request(path)
              report["checks"].append({"path":path,"http_status":status,"body":body})
              assert status == 200, f"{path} returned HTTP {status}: {body}"
          diag = request("/diagnostics")[1]
          models = request("/v1/models")[1]
          performance = request("/performance")[1]
          assert root.get("general_chat_ready") is True, f"General chat model is not configured: {root}"
          assert diag.get("general_chat_ready") is True, f"General chat backend is not ready: {diag}"
          assert isinstance(performance.get("fast_path_cache"), dict), f"Fast-path cache telemetry missing: {performance}"
          assert isinstance(performance.get("latency", {}).get("measurements"), dict), f"Latency telemetry missing: {performance}"
          assert performance.get("latency", {}).get("sub_nanosecond_latency_verified") is False, "Measurement report must not claim unverified sub-nanosecond latency."
          assert diag.get("inference_configured") is True and diag.get("checks",{}).get("deterministic_reasoner_loaded") is True and diag.get("native_reasoner_version") == "0.2", f"Native reasoner/model not ready: {diag}"
          assert models.get("data"), f"No model advertised: {models}"
          model_id = models["data"][0]["id"]
          status, chat = request("/v1/chat/completions", {
              "model":model_id,
              "messages":[{"role":"user","content":"Say hello and identify the type of model you are."}],
              "max_tokens":80,"temperature":0.2
          }, timeout=60)
          choices = chat.get("choices",[])
          answer = choices[0].get("message",{}).get("content","") if choices else ""
          aries_metrics = chat.get("aries_native", {}) if isinstance(chat, dict) else {}
          report["checks"].append({"path":"/v1/chat/completions","http_status":status,
                                   "nonempty_response":bool(answer.strip()),"response_preview":answer[:180],
                                   "inference_ns":aries_metrics.get("inference_ns"),
                                   "fast_path_cache_hit":aries_metrics.get("fast_path_cache_hit")})
          assert status == 200 and answer.strip(), f"Native inference did not return a non-empty completion: {chat}"
          assert isinstance(aries_metrics.get("inference_ns"), int) and aries_metrics.get("inference_ns") > 0, f"Missing measured inference_ns field: {aries_metrics}"
          status, qa = request("/v1/chat/completions", {
              "model":model_id,
              "messages":[{"role":"user","content":"Answer in one word: What is the capital of France?"}],
              "max_tokens":24,"temperature":0
          }, timeout=90)
          qa_choices = qa.get("choices",[])
          qa_answer = qa_choices[0].get("message",{}).get("content","") if qa_choices else ""
          report["checks"].append({"path":"/v1/chat/completions general QA","http_status":status,
                                   "expected":"Paris","response_preview":qa_answer[:180],
                                   "error":qa if status != 200 else None})
          print(json.dumps(report,indent=2))
          assert status == 200 and "paris" in qa_answer.lower(), f"General question-answer test failed: status={status}, response={qa}"
          print("PASS: general chat answered the capital-of-France check.")
          PY

      - name: Run 10-case external diagnostic benchmark
        env:
          ARIES_BASE_URL: https://aries-tier0-api-6qjh.onrender.com
          ARIES_MODEL_ID: aries-native-ngram
        run: |
          mkdir -p reports
          python tools/aries_bench.py --base-url "$ARIES_BASE_URL" --model "$ARIES_MODEL_ID" --limit 10 --output reports/public-benchmark.json
          {
            echo "### ARIES external diagnostic benchmark"
            echo "The attached JSON contains measured request latency and exact-match results for 10 authored diagnostic cases."
            echo "This is not an official leaderboard result or an independent model-quality certification."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measured benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: aries-public-diagnostic-benchmark
          path: reports/public-benchmark.json
          if-no-files-found: error

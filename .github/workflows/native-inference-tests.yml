name: ARIES Native Inference Tests

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "software/**"
      - ".github/workflows/native-inference-tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build ARIES-owned inference image
        run: docker build --tag aries-native:test .
      - name: Start native API and verify endpoints
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name aries-native-test --publish 18080:10000 aries-native:test
          trap 'docker stop aries-native-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/tmp/health.json; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json, urllib.request
          base = "http://127.0.0.1:18080"
          def get(path):
              with urllib.request.urlopen(base+path, timeout=10) as r:
                  return r.status, json.loads(r.read().decode())
          status, health = get("/health")
          assert status == 200 and health.get("status") == "ok", health
          status, root = get("/")
          assert status == 200 and root.get("general_chat_ready") is True and (root.get("local_model_loaded") is True or root.get("general_chat_upstream_configured") is True), root
          status, diag = get("/diagnostics")
          assert status == 200 and diag.get("inference_configured") is True and diag.get("general_chat_ready") is True, diag
          status, models = get("/v1/models")
          assert status == 200 and models.get("data"), models
          model_id = models["data"][0]["id"]
          payload = json.dumps({"model":model_id,"messages":[{"role":"user","content":"Give a brief greeting."}],"max_tokens":80,"temperature":0.2}).encode()
          req = urllib.request.Request(base+"/v1/chat/completions", data=payload,
              headers={"Content-Type":"application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=30) as r:
              code, chat = r.status, json.loads(r.read().decode())
          choices = chat.get("choices", [])
          answer = choices[0].get("message",{}).get("content","") if choices else ""
          assert code == 200 and answer.strip(), chat

          qa_payload = json.dumps({
              "model": model_id,
              "messages": [{"role": "user", "content": "What is the capital of France? Reply with the city name only."}],
              "max_tokens": 24,
              "temperature": 0
          }).encode()
          qa_req = urllib.request.Request(base+"/v1/chat/completions", data=qa_payload,
              headers={"Content-Type":"application/json"}, method="POST")
          with urllib.request.urlopen(qa_req, timeout=45) as r:
              qa_code, qa_chat = r.status, json.loads(r.read().decode())
          qa_choices = qa_chat.get("choices", [])
          qa_answer = qa_choices[0].get("message",{}).get("content","") if qa_choices else ""
          assert qa_code == 200 and "paris" in qa_answer.lower(), {"response": qa_answer, "payload": qa_chat}

          print(json.dumps({"health":health,"readiness":root,"diagnostics":diag,
              "model":model_id,"greeting_preview":answer[:160],
              "general_question":"capital of France","general_answer":qa_answer},indent=2))
          print("PASS: container build, local general chat, and HTTP inference.")
          PY

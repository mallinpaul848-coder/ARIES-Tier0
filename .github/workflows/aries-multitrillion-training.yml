name: ARIES Multitrillion Token Training

on:
  workflow_dispatch:
    inputs:
      corpus_path:
        description: Absolute path to a licensed text corpus on the self-hosted GPU runner
        required: true
        type: string
      target_training_tokens:
        description: Cumulative token exposures target (3 trillion by default)
        required: true
        default: "3000000000000"
        type: string
      max_steps:
        description: Additional optimizer steps; use 0 to run until the token target is reached
        required: true
        default: "3"
        type: string
      tokenizer:
        description: byte or hf:TOKENIZER_NAME
        required: true
        default: "byte"
        type: string
      processes_per_node:
        description: Number of GPU worker processes for torchrun (must not exceed available GPUs)
        required: true
        default: "1"
        type: string
      resume_checkpoint_path:
        description: Optional path to an existing compatible checkpoint on the self-hosted runner
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: aries-multitrillion-training
  cancel-in-progress: false

jobs:
  train:
    # Requires a GPU-equipped runner managed by the repository owner.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 10080
    steps:
      - name: Check out ARIES
        uses: actions/checkout@v4

      - name: Install training dependencies
        env:
          TOKENIZER: ${{ inputs.tokenizer }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade "torch>=2.2,<3.0"
          if [[ "$TOKENIZER" == hf:* ]]; then
            python -m pip install --upgrade transformers tokenizers
          fi

      - name: Check training hardware and inputs
        env:
          CORPUS_PATH: ${{ inputs.corpus_path }}
          TARGET_TOKENS: ${{ inputs.target_training_tokens }}
          MAX_STEPS: ${{ inputs.max_steps }}
          TOKENIZER: ${{ inputs.tokenizer }}
          PROCESSES_PER_NODE: ${{ inputs.processes_per_node }}
          RESUME_CHECKPOINT: ${{ inputs.resume_checkpoint_path }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import torch

          corpus = Path(os.environ["CORPUS_PATH"]).expanduser()
          if not corpus.is_file() or corpus.stat().st_size == 0:
              raise SystemExit(f"Corpus is missing or empty: {corpus}")
          if not torch.cuda.is_available():
              raise SystemExit("A CUDA-capable GPU and CUDA-enabled PyTorch are required.")
          target = int(os.environ["TARGET_TOKENS"])
          steps = int(os.environ["MAX_STEPS"])
          workers = int(os.environ["PROCESSES_PER_NODE"])
          if target < 1 or steps < 0 or workers < 1:
              raise SystemExit("Target must be positive; max steps must be >= 0; processes per node must be >= 1.")
          if workers > torch.cuda.device_count():
              raise SystemExit(f"Requested {workers} GPU processes, but only {torch.cuda.device_count()} CUDA devices are available.")
          tokenizer = os.environ["TOKENIZER"]
          if tokenizer != "byte" and not tokenizer.startswith("hf:"):
              raise SystemExit("Tokenizer must be 'byte' or 'hf:TOKENIZER_NAME'.")
          if tokenizer.startswith("hf:") and not tokenizer[3:].strip():
              raise SystemExit("Hugging Face tokenizer name is empty.")
          resume = os.environ.get("RESUME_CHECKPOINT", "").strip()
          if resume and not Path(resume).expanduser().is_file():
              raise SystemExit(f"Resume checkpoint not found: {resume}")
          print(f"GPUs: {torch.cuda.device_count()} | worker processes: {workers}")
          for index in range(torch.cuda.device_count()):
              print(f"GPU {index}: {torch.cuda.get_device_name(index)}")
          print(f"Corpus bytes: {corpus.stat().st_size:,}")
          print(f"Target token exposures: {target:,}")
          print(f"Additional steps: {steps if steps else 'until target'}")
          print(f"Tokenizer mode: {tokenizer}")
          print(f"Resume checkpoint: {resume or 'new run'}")
          PY

      - name: Train and checkpoint ARIES
        env:
          CORPUS_PATH: ${{ inputs.corpus_path }}
          TARGET_TOKENS: ${{ inputs.target_training_tokens }}
          MAX_STEPS: ${{ inputs.max_steps }}
          TOKENIZER: ${{ inputs.tokenizer }}
          PROCESSES_PER_NODE: ${{ inputs.processes_per_node }}
          RESUME_CHECKPOINT: ${{ inputs.resume_checkpoint_path }}
        run: |
          set -euo pipefail
          ARGS=(
            --corpus "$CORPUS_PATH"
            --tokenizer "$TOKENIZER"
            --output-dir artifacts/aries-multitrillion
            --target-training-tokens "$TARGET_TOKENS"
            --max-steps "$MAX_STEPS"
            --checkpoint-every-steps 100
          )
          if [[ -n "$RESUME_CHECKPOINT" ]]; then
            ARGS+=(--resume-from-checkpoint "$RESUME_CHECKPOINT")
          fi
          if [[ "$PROCESSES_PER_NODE" -gt 1 ]]; then
            torchrun --standalone --nproc_per_node="$PROCESSES_PER_NODE" training/aries_trillion_token_trainer.py "${ARGS[@]}"
          else
            python training/aries_trillion_token_trainer.py "${ARGS[@]}"
          fi

      - name: Upload checkpoint and measured training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aries-multitrillion-training-${{ github.run_id }}
          path: |
            artifacts/aries-multitrillion/checkpoint.pt
            artifacts/aries-multitrillion/training_evidence.json
          if-no-files-found: warn
          retention-days: 30

name: ARIES API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run API tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Run Mallin–PRISE gateway profiling benchmark
        run: python tools/benchmark_gateway_profile.py --repeats 100 --output gateway-profile-report.json
      - name: Upload gateway profiling report
        uses: actions/upload-artifact@v4
        with:
          name: mallin-prise-gateway-profile
          path: gateway-profile-report.json
          if-no-files-found: error

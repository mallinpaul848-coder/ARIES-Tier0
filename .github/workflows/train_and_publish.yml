name: ARIES Train, Validate, and Publish Model

on:
  workflow_dispatch:
    inputs:
      hf_repo_id:
        description: "Hugging Face model repository (namespace/name)"
        required: true
        default: "PaulMallin/aries-core-v1"
        type: string
      corpus_path:
        description: "Optional UTF-8 training corpus path. If absent, WikiText-2 raw training split is fetched."
        required: true
        default: "data/training.txt"
        type: string
      training_steps:
        description: "Training steps (CPU-only; quality is not guaranteed)"
        required: true
        default: "1000"
        type: string
  push:
    branches: ["main"]
    paths:
      - "scripts/build_and_publish.py"
      - "scripts/train_and_publish_enhanced.py"
      - "software/train_and_publish_aries_lm.py"
      - "data/training.txt"
      - ".github/workflows/train_and_publish.yml"

permissions:
  contents: write

jobs:
  train-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install corpus loader
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets>=3,<5"

      - name: Prepare training corpus if none is provided
        env:
          CORPUS_PATH: ${{ github.event.inputs.corpus_path || 'data/training.txt' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["CORPUS_PATH"])
          if path.is_file() and len(path.read_text(encoding="utf-8-sig").strip()) >= 100_000:
              print(f"Using supplied corpus: {path}")
              raise SystemExit(0)
          print("No adequate supplied corpus found; fetching the public WikiText-2 raw training split.")
          from datasets import load_dataset
          ds = load_dataset("Salesforce/wikitext", "wikitext-2-raw-v1", split="train")
          text = "\n".join(row["text"] for row in ds if row.get("text", "").strip()).strip()
          if len(text) < 100_000:
              raise SystemExit(f"Downloaded corpus is unexpectedly small ({len(text)} characters).")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(text + "\n", encoding="utf-8")
          print(f"Prepared {len(text):,} characters at {path}. Dataset card/license and attribution must be reviewed before public redistribution.")
          PY

      - name: Validate corpus and publishing configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TARGET_REPO: ${{ github.event.inputs.hf_repo_id || 'PaulMallin/aries-core-v1' }}
          CORPUS_PATH: ${{ github.event.inputs.corpus_path || 'data/training.txt' }}
          TRAINING_STEPS: ${{ github.event.inputs.training_steps || '1000' }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          repo = os.environ["HF_TARGET_REPO"].strip()
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*", repo):
              raise SystemExit("HF_TARGET_REPO must be namespace/name.")
          try:
              steps = int(os.environ["TRAINING_STEPS"])
          except ValueError:
              raise SystemExit("TRAINING_STEPS must be an integer.")
          if not 1 <= steps <= 100000:
              raise SystemExit("TRAINING_STEPS must be between 1 and 100000.")
          corpus = Path(os.environ["CORPUS_PATH"])
          if not corpus.is_file():
              raise SystemExit(f"Training corpus not found after preparation: {corpus}")
          size = len(corpus.read_text(encoding="utf-8-sig").strip())
          if size < 100000:
              raise SystemExit(f"Corpus has only {size:,} characters; at least 100,000 are required.")
          if not os.environ.get("HF_TOKEN", "").strip():
              print("NOTICE: HF_TOKEN is missing. Workflow will train and validate locally but will not publish to Hugging Face.")
          else:
              print("HF_TOKEN is present; after validation, the workflow will attempt Hugging Face publication.")
          print(f"Preflight passed: target={repo}; corpus={corpus}; characters={size:,}; steps={steps}.")
          PY

      - name: Install CPU training dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<2.7"
          python -m pip install "transformers>=4.45,<5" "tokenizers>=0.20" "huggingface_hub>=0.26" "safetensors>=0.4" "accelerate>=0.26"

      - name: Train, export, validate locally, and publish when credentials exist
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TARGET_REPO: ${{ github.event.inputs.hf_repo_id || 'PaulMallin/aries-core-v1' }}
          CORPUS_PATH: ${{ github.event.inputs.corpus_path || 'data/training.txt' }}
          TRAINING_STEPS: ${{ github.event.inputs.training_steps || '1000' }}
          TRAINING_DATA_PROVENANCE: "Salesforce/wikitext wikitext-2-raw-v1 fallback; see dataset card and license. If a custom corpus path is supplied, uploader is responsible for its provenance and rights."
        run: |
          python scripts/train_and_publish_enhanced.py \
            --corpus "$CORPUS_PATH" \
            --repo-id "$HF_TARGET_REPO" \
            --output-dir artifacts/aries-core-v1 \
            --steps "$TRAINING_STEPS"

      - name: Publish validated model files to this public GitHub repository
        if: success()
        run: |
          set -euo pipefail
          test -s artifacts/aries-core-v1/config.json
          test -s artifacts/aries-core-v1/model.safetensors
          test -s artifacts/aries-core-v1/tokenizer.json
          publish_tmp="$(mktemp -d)"
          cp artifacts/aries-core-v1/config.json artifacts/aries-core-v1/model.safetensors artifacts/aries-core-v1/tokenizer.json artifacts/aries-core-v1/tokenizer_config.json artifacts/aries-core-v1/README.md "$publish_tmp"/
          # Rebase publication on the latest main so concurrent documentation commits do not cause a non-fast-forward push.
          git fetch origin main
          git checkout -B aries-publish origin/main
          mkdir -p published/aries-core-v1
          cp "$publish_tmp"/* published/aries-core-v1/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f published/aries-core-v1/
          if git diff --cached --quiet; then
            echo "Published model files are already current."
          else
            git commit -m "Publish validated ARIES model artifacts"
            git push origin HEAD:main
          fi
          echo "PASS: model files are available in the public GitHub repository at published/aries-core-v1/."

      - name: Independently download public model and verify generation
        if: success() && env.HF_TOKEN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TARGET_REPO: ${{ github.event.inputs.hf_repo_id || 'PaulMallin/aries-core-v1' }}
        run: |
          python benchmarks/verify_hf_model.py "$HF_TARGET_REPO" --max-new-tokens 16

      - name: Upload model and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aries-model-training-publish-evidence
          path: artifacts/aries-core-v1/
          if-no-files-found: ignore
          retention-days: 30

name: ARIES Independent LM Evaluation
on:
  workflow_dispatch:
    inputs:
      hf_repo_id:
        description: "Public Hugging Face model repository (namespace/name)"
        required: true
        type: string
      revision:
        description: "Exact Hugging Face model commit SHA to evaluate"
        required: true
        type: string
      tasks:
        description: "lm-evaluation-harness task IDs"
        required: true
        default: "gsm8k,mmlu_pro,gpqa_main"
        type: string
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model hub metadata client
        run: python -m pip install "huggingface_hub>=0.26"
      - name: Validate public model and pinned revision
        env:
          HF_REPO_ID: ${{ inputs.hf_repo_id }}
          MODEL_REVISION: ${{ inputs.revision }}
          TASKS: ${{ inputs.tasks }}
        run: |
          python - <<'PY'
          import os, re
          from huggingface_hub import HfApi
          repo = os.environ["HF_REPO_ID"].strip()
          rev = os.environ["MODEL_REVISION"].strip()
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*", repo):
              raise SystemExit("hf_repo_id must be namespace/name.")
          if not re.fullmatch(r"[0-9a-fA-F]{40}", rev):
              raise SystemExit("revision must be a full 40-character model commit SHA for reproducibility.")
          tasks = [x.strip() for x in os.environ["TASKS"].split(",") if x.strip()]
          if not tasks:
              raise SystemExit("At least one lm-evaluation-harness task is required.")
          info = HfApi().model_info(repo, revision=rev)
          if info.private:
              raise SystemExit("Model repository is private; public independent evaluation requires a public repo.")
          print(f"Public model: https://huggingface.co/{repo}")
          print(f"Revision: {rev}")
          print(f"Tasks: {','.join(tasks)}")
          PY
      - name: Install independent evaluation harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install "lm_eval[hf]"
      - name: Run full requested evaluation tasks
        env:
          HF_REPO_ID: ${{ inputs.hf_repo_id }}
          MODEL_REVISION: ${{ inputs.revision }}
          TASKS: ${{ inputs.tasks }}
        run: |
          mkdir -p evaluation-results
          lm_eval \
            --model hf \
            --model_args "pretrained=$HF_REPO_ID,revision=$MODEL_REVISION,dtype=auto" \
            --tasks "$TASKS" \
            --batch_size 1 \
            --output_path evaluation-results/results.json
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aries-independent-evaluation
          path: evaluation-results/
          if-no-files-found: warn
          retention-days: 90

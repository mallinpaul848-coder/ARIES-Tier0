name: ARIES Math Core Tests

on:
  push:
    branches: [main]
    paths:
      - "math_core/**"
      - "tests/test_math_invariants.py"
      - ".github/workflows/math-core-tests.yml"
  pull_request:
    paths:
      - "math_core/**"
      - "tests/test_math_invariants.py"
      - ".github/workflows/math-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run math invariant tests
        run: python -m pytest -q tests/test_math_invariants.py

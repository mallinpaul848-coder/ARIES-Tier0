name: ARIES Performance Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */12 * * *"
  push:
    branches: [main]
    paths:
      - "tools/aries_bench.py"
      - "api/**"
      - "aries_math/**"
      - ".github/workflows/aries-performance.yml"

permissions:
  contents: write

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate benchmark harness
        run: |
          python -m py_compile tools/aries_bench.py tools/aries_combined_bench.py
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("aries_bench", "tools/aries_bench.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.percentile([], 95) is None
          assert module.percentile([10, 20, 30, 40], 50) == 25
          assert module.percentile([10, 20, 30, 40], 95) == 38.5
          assert module.normalize(" ARIES-OK. ") == "aries-ok"
          print("Benchmark metric helper checks passed.")
          PY
      - name: Run public endpoint performance and diagnostic suite
        env:
          ARIES_BASE_URL: https://aries-tier0-api-6qjh.onrender.com
          ARIES_MODEL_ID: auto
        run: |
          python tools/aries_bench.py --base-url "$ARIES_BASE_URL" --model "$ARIES_MODEL_ID" --timeout 75 --limit 10 --concurrency 1 --output reports/aries-public-performance.json
      - name: Run combined concurrency matrix
        env:
          ARIES_BASE_URL: https://aries-tier0-api-6qjh.onrender.com
          ARIES_MODEL_ID: auto
        run: |
          python tools/aries_combined_bench.py --base-url "$ARIES_BASE_URL" --model "$ARIES_MODEL_ID" --timeout 75 --repeats 2 --output reports/aries-combined-performance.json
      - name: Persist benchmark report in Git
        if: always()
        run: |
          if [ -f reports/aries-public-performance.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/aries-*.json
            if ! git diff --cached --quiet; then
              git commit -m "Record ARIES public performance benchmark"
              git push
            fi
          else
            echo "No JSON report was produced; see benchmark step logs for the failure."
          fi
      - name: Upload measured performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aries-performance-${{ github.run_number }}
          path: reports/aries-*.json
          if-no-files-found: warn
          retention-days: 90

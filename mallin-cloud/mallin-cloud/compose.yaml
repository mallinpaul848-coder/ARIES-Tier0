services:
  mallin-cloud:
    build: .
    container_name: mallin-cloud
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      MALLIN_ADMIN_TOKEN: ${MALLIN_ADMIN_TOKEN:?Set MALLIN_ADMIN_TOKEN in .env}
      MALLIN_DATA_DIR: /data
    volumes:
      - mallin_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  mallin_data:

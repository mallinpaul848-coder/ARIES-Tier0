name: ARIES Checkpoint Validation and Standard Evaluation

on:
  push:
    branches: [main]
    paths:
      - "published/aries-core-v1/**"
      - ".github/workflows/aries-model-evaluation.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation and evaluator
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.2,<2.7" "transformers>=4.45,<5" "safetensors>=0.4" "lm-eval[hf]>=0.4.8"

      - name: Verify checkpoint, tokenizer, and generation
        id: verify
        run: |
          mkdir -p evaluation-results
          python - <<'PY'
          import json, time, traceback
          from pathlib import Path
          from datetime import datetime, timezone
          report = {
              "project": "ARIES Tier 0",
              "evaluation_type": "local_checkpoint_load_and_generation_smoke_test",
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "checkpoint": "published/aries-core-v1",
              "status": "failed"
          }
          started = time.perf_counter()
          try:
              from transformers import AutoConfig, AutoTokenizer, AutoModelForCausalLM
              path = "published/aries-core-v1"
              config = AutoConfig.from_pretrained(path, local_files_only=True)
              tokenizer = AutoTokenizer.from_pretrained(path, local_files_only=True)
              model = AutoModelForCausalLM.from_pretrained(path, local_files_only=True)
              inputs = tokenizer("ARIES experimental model:", return_tensors="pt")
              outputs = model.generate(**inputs, max_new_tokens=16, do_sample=False)
              generated = tokenizer.decode(outputs[0], skip_special_tokens=True)
              report.update({
                  "status": "passed",
                  "model_type": getattr(config, "model_type", None),
                  "architecture": getattr(config, "architectures", None),
                  "parameter_count": sum(p.numel() for p in model.parameters()),
                  "tokenizer_vocab_size": len(tokenizer),
                  "generated_text_present": bool(generated.strip()),
                  "generated_text_sample": generated[:240],
                  "elapsed_seconds": round(time.perf_counter() - started, 3)
              })
              if not generated.strip():
                  report["status"] = "failed"
                  report["error"] = "Generation returned empty text"
          except Exception as exc:
              report.update({"status": "failed", "error": str(exc), "traceback": traceback.format_exc()[-5000:]})
          Path("evaluation-results/model-load-report.json").write_text(json.dumps(report, indent=2) + "\\n")
          print(json.dumps(report, indent=2))
          if report["status"] != "passed":
              raise SystemExit(1)
          PY

      - name: Run limited standard HellaSwag evaluation
        if: success()
        run: |
          lm-eval run \
            --model hf \
            --model_args pretrained=published/aries-core-v1,dtype=float32 \
            --tasks hellaswag \
            --limit 25 \
            --batch_size 1 \
            --device cpu \
            --output_path evaluation-results/hellaswag-25.json

      - name: Record evaluation scope
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path("evaluation-results/evaluation-scope.json")
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps({
              "project": "ARIES Tier 0",
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "scope": "checkpoint loading, deterministic generation smoke test, and at most 25 HellaSwag examples",
              "is_official_leaderboard_result": False,
              "is_full_benchmark": False,
              "notes": [
                  "This small CI run is a reproducibility smoke test only.",
                  "Its HellaSwag subset is not comparable to full leaderboard scores.",
                  "The public Render endpoint serves a separate native character n-gram baseline.",
                  "Official submission requires a public Hugging Face model repository, correct data rights, and explicit submission confirmation."
              ]
          }, indent=2) + "\\n")
          PY

      - name: Upload evaluation report even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aries-checkpoint-evaluation
          path: evaluation-results/
          if-no-files-found: warn
          retention-days: 90

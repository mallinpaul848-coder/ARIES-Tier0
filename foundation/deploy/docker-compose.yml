services:
  mallin-authoritative-dns:
    build:
      context: ../..
      dockerfile: foundation/deploy/Dockerfile.dns
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - ./zones.json:/opt/mallin/zones.json:ro
    environment:
      MALLIN_DNS_HOST: 0.0.0.0
      MALLIN_DNS_PORT: "53"
      MALLIN_DNS_ZONE_FILE: /opt/mallin/zones.json
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

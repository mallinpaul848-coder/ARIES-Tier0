name: ARIES Quantum Statevector Tests

on:
  push:
    branches: [main, "feature/quantum-statevector-validation"]
    paths:
      - "aries_math/quantum_simulation.py"
      - "tests/test_quantum_simulation.py"
      - ".github/workflows/quantum-simulation-tests.yml"
  pull_request:
    paths:
      - "aries_math/quantum_simulation.py"
      - "tests/test_quantum_simulation.py"
      - ".github/workflows/quantum-simulation-tests.yml"

permissions:
  contents: read

jobs:
  statevector-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run quantum simulator unit tests
        run: python -m unittest discover -s tests -p "test_quantum_simulation.py" -v

name: ARIES Secure Publish Existing Checkpoint

on:
  workflow_dispatch:
    inputs:
      hf_repo_id:
        description: "Hugging Face model repository (namespace/name)"
        required: true
        default: "PaulMallin/aries-core-v1"
        type: string
      model_dir:
        description: "Existing trained checkpoint directory in this repository"
        required: true
        default: "published/aries-core-v1"
        type: string
  push:
    branches: ["main"]
    paths:
      - "scripts/publish_robust.py"
      - ".github/workflows/secure_publish.yml"

permissions:
  contents: read

jobs:
  secure-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out ARIES repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model validation and publishing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.2,<2.7" "transformers>=4.45,<5" "huggingface_hub>=0.26" "safetensors>=0.4"

      - name: Validate existing checkpoint and publish allowlisted files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TARGET_REPO: ${{ inputs.hf_repo_id || 'PaulMallin/aries-core-v1' }}
          ARIES_MODEL_DIR: ${{ inputs.model_dir || 'published/aries-core-v1' }}
        run: python scripts/publish_robust.py

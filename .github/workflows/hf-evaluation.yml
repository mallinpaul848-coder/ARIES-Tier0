name: Hugging Face model evaluation (reproducible CPU baseline)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "published/aries-core-v1/**"
      - "benchmarks/hf-evaluation/**"
      - ".github/workflows/hf-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "published/aries-core-v1/**"
      - "benchmarks/hf-evaluation/**"
      - ".github/workflows/hf-evaluation.yml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1" "transformers==4.48.3" "safetensors==0.5.3" "lm_eval==0.4.8"
      - name: Verify model loads and generates
        run: python benchmarks/verify_hf_model.py published/aries-core-v1 --max-new-tokens 16
      - name: Run standardized benchmark subset
        run: |
          mkdir -p reports/hf-evaluation
          lm_eval \
            --model hf \
            --model_args pretrained=published/aries-core-v1,dtype=float32 \
            --tasks hellaswag,arc_easy,winogrande \
            --device cpu \
            --batch_size 1 \
            --limit 25 \
            --output_path reports/hf-evaluation/results.json
      - name: Record environment and revision metadata
        if: always()
        run: |
          python - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          def cmd(*args):
              try:
                  return subprocess.check_output(args, text=True).strip()
              except Exception:
                  return "unavailable"
          out = Path("reports/hf-evaluation")
          out.mkdir(parents=True, exist_ok=True)
          meta = {
              "benchmark_scope": "smoke evaluation only; 25 examples per task",
              "tasks": ["hellaswag", "arc_easy", "winogrande"],
              "device": "CPU",
              "python": platform.python_version(),
              "platform": platform.platform(),
              "git_commit": cmd("git", "rev-parse", "HEAD"),
              "git_status": cmd("git", "status", "--short"),
              "torch_version": cmd("python", "-c", "import torch; print(torch.__version__)"),
              "transformers_version": cmd("python", "-c", "import transformers; print(transformers.__version__)"),
              "lm_eval_version": cmd("python", "-c", "import lm_eval; print(getattr(lm_eval, '__version__', 'installed'))"),
          }
          (out / "environment.json").write_text(json.dumps(meta, indent=2) + "\\n", encoding="utf-8")
          print(json.dumps(meta, indent=2))
          PY
      - name: Upload raw evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aries-hf-evaluation-${{ github.run_number }}
          path: reports/hf-evaluation/
          if-no-files-found: warn
          retention-days: 90

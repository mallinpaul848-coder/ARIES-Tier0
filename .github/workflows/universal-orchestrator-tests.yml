name: ARIES Universal Orchestrator Tests

on:
  push:
    branches: [main, "feature/universal-performance-orchestrator"]
    paths:
      - "aries_math/universal_orchestrator.py"
      - "tests/test_universal_orchestrator.py"
      - ".github/workflows/universal-orchestrator-tests.yml"
  pull_request:
    paths:
      - "aries_math/universal_orchestrator.py"
      - "tests/test_universal_orchestrator.py"
      - ".github/workflows/universal-orchestrator-tests.yml"

permissions:
  contents: read

jobs:
  orchestrator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile module
        run: python -m py_compile aries_math/universal_orchestrator.py
      - name: Run orchestrator tests
        run: python -m unittest discover -s tests -p "test_universal_orchestrator.py" -v

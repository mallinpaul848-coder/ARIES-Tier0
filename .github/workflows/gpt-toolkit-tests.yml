name: Optional GPT Toolkit Tests

on:
  push:
    branches: [main, "upgrade/**"]
    paths:
      - "software/gpt_toolkit.py"
      - "tests/test_gpt_toolkit.py"
      - ".github/workflows/gpt-toolkit-tests.yml"
  pull_request:
    paths:
      - "software/gpt_toolkit.py"
      - "tests/test_gpt_toolkit.py"
      - ".github/workflows/gpt-toolkit-tests.yml"
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Run offline toolkit tests
        run: python -m pytest -q tests/test_gpt_toolkit.py

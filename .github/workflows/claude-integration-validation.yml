name: ARIES Claude-Pattern Integration Validation
on:
  push:
    branches: [claude-integration-third-party-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Claude-pattern tool loop and API
        run: python -m py_compile api/main.py aries_math/tool_agent.py
      - name: Run bounded tool-loop security and behavior tests
        run: python -m unittest discover -s tests -p 'test_tool_agent.py' -v
      - name: Run API and research regression tests
        run: |
          python -m unittest discover -s tests -p 'test_api.py' -v
          python -m unittest discover -s tests -p 'test_prize_problem_lab.py' -v
          python -m unittest discover -s tests -p 'test_aries_alternative_benchmark.py' -v

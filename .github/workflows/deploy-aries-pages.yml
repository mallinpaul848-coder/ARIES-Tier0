name: Publish ARIES Chat to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/deploy-aries-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public chat page
        run: |
          mkdir -p public-site
          cp index.html public-site/index.html
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

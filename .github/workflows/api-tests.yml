name: ARIES API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run API tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Run ARIES fast-path microbenchmark
        run: |
          python tools/aries_fastpath_microbench.py --iterations 20000 --warmup 1000 --concurrency 1 --output aries-fastpath-1w.json
          python tools/aries_fastpath_microbench.py --iterations 20000 --warmup 1000 --concurrency 8 --output aries-fastpath-8w.json
      - name: Upload fast-path raw reports
        uses: actions/upload-artifact@v4
        with:
          name: aries-fastpath-microbenchmark
          path: aries-fastpath-*.json
          if-no-files-found: error

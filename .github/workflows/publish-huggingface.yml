name: Publish ARIES checkpoint to Hugging Face

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: "Your Hugging Face namespace/model name (for example, YOUR_USERNAME/aries-core-v1)"
        required: true
        type: string
      private:
        description: "Create the Hugging Face model repository as private"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check required secret and repository ID
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ inputs.repo_id }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Missing HF_TOKEN. Add a Hugging Face write token in GitHub Actions repository secrets."; exit 1; }
          python - <<'PY'
          import os
          repo_id = os.environ["HF_REPO_ID"].strip()
          if repo_id.count("/") != 1 or any(not part for part in repo_id.split("/")):
              raise SystemExit("repo_id must be in namespace/model-name format")
          print("Repository ID format is valid.")
          PY

      - name: Install publishing and model verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "huggingface_hub>=0.27" "transformers>=4.45,<5" "torch>=2.2,<2.7" "safetensors>=0.4"

      - name: Create or confirm model repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ inputs.repo_id }}
          HF_PRIVATE: ${{ inputs.private }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ["HF_REPO_ID"].strip()
          private = os.environ["HF_PRIVATE"].lower() == "true"
          api.create_repo(repo_id=repo_id, repo_type="model", private=private, exist_ok=True)
          print(f"Repository is ready: https://huggingface.co/{repo_id}")
          PY

      - name: Upload model configuration, weights, tokenizer, and model card
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ inputs.repo_id }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id=os.environ["HF_REPO_ID"].strip(),
              repo_type="model",
              folder_path="published/aries-core-v1",
              commit_message="Publish ARIES Core v1 experimental checkpoint and model card",
              ignore_patterns=["*.log", "*.tmp", ".DS_Store"],
          )
          print("Upload completed.")
          PY

      - name: Verify repository is public and model loads and generates
        if: ${{ !inputs.private }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ inputs.repo_id }}
        run: |
          python benchmarks/verify_hf_model.py "$HF_REPO_ID" --max-new-tokens 16

      - name: Explain private repository verification status
        if: ${{ inputs.private }}
        run: echo "Upload completed to a private repository. Public-download verification was skipped by request."

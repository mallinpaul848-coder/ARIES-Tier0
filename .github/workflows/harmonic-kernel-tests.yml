name: ARIES Harmonic Kernel Tests

on:
  push:
    branches: [main]
    paths:
      - "include/aries_harmonic_kernel.hpp"
      - "include/aries_fast_kernel.hpp"
      - "math_core/aries_harmonic_bridge.py"
      - "tests/cpp/test_aries_harmonic_kernel.cpp"
      - "tests/cpp/test_aries_fast_kernel.cpp"
      - "tests/test_aries_harmonic_bridge.py"
      - "CMakeLists.txt"
      - ".github/workflows/harmonic-kernel-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "include/aries_harmonic_kernel.hpp"
      - "include/aries_fast_kernel.hpp"
      - "math_core/aries_harmonic_bridge.py"
      - "tests/cpp/test_aries_harmonic_kernel.cpp"
      - "tests/cpp/test_aries_fast_kernel.cpp"
      - "tests/test_aries_harmonic_bridge.py"
      - "CMakeLists.txt"
      - ".github/workflows/harmonic-kernel-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harmonic-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run Python bridge tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_aries_harmonic_bridge.py
      - name: Configure C++20 tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build C++20 tests
        run: cmake --build build --target test_aries_harmonic_kernel test_aries_fast_kernel --parallel 2
      - name: Run C++20 tests
        run: ctest --test-dir build --output-on-failure

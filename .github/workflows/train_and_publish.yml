name: ARIES Train, Validate, and Publish Model

on:
  workflow_dispatch:
    inputs:
      hf_repo_id:
        description: "Hugging Face model repository (namespace/name)"
        required: true
        default: "PaulMallin/aries-core-v1"
        type: string
      corpus_path:
        description: "UTF-8 training corpus you own or are licensed to use"
        required: true
        default: "data/training.txt"
        type: string
      training_steps:
        description: "Training steps (CPU-only; quality is not guaranteed)"
        required: true
        default: "1000"
        type: string
  push:
    branches: ["main"]
    paths:
      - "scripts/build_and_publish.py"
      - "software/train_and_publish_aries_lm.py"
      - "data/training.txt"
      - ".github/workflows/train_and_publish.yml"

permissions:
  contents: read

jobs:
  train-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate training inputs and publishing secret
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TARGET_REPO: ${{ github.event.inputs.hf_repo_id || 'PaulMallin/aries-core-v1' }}
          CORPUS_PATH: ${{ github.event.inputs.corpus_path || 'data/training.txt' }}
          TRAINING_STEPS: ${{ github.event.inputs.training_steps || '1000' }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          problems = []
          token = os.environ.get("HF_TOKEN", "")
          if not token:
              problems.append("HF_TOKEN secret is missing (GitHub repository Settings > Secrets and variables > Actions).")
          repo = os.environ["HF_TARGET_REPO"].strip()
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*", repo):
              problems.append("HF_TARGET_REPO must be namespace/name.")
          try:
              steps = int(os.environ["TRAINING_STEPS"])
              if not 1 <= steps <= 100000:
                  problems.append("TRAINING_STEPS must be between 1 and 100000.")
          except ValueError:
              problems.append("TRAINING_STEPS must be an integer.")
          corpus = Path(os.environ["CORPUS_PATH"])
          if not corpus.is_file():
              problems.append(f"Training corpus not found: {corpus}. Add a UTF-8 corpus you own or are licensed to use.")
          else:
              size = len(corpus.read_text(encoding="utf-8-sig").strip())
              if size < 100000:
                  problems.append(f"Corpus has {size:,} characters; at least 100,000 are required. A larger, diverse licensed corpus is needed for meaningful training.")
          if problems:
              print("TRAIN/PUBLISH PREFLIGHT FAILED:")
              for problem in problems:
                  print(f" - {problem}")
              raise SystemExit(1)
          print(f"Preflight passed: target={repo}; corpus={corpus}; characters={size:,}; steps={steps}.")
          PY

      - name: Install CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<2.7"
          python -m pip install "transformers>=4.45,<5" "tokenizers>=0.20" "huggingface_hub>=0.26" "safetensors>=0.4" "accelerate>=0.26"

      - name: Train, export, validate locally, and publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_TARGET_REPO: ${{ github.event.inputs.hf_repo_id || 'PaulMallin/aries-core-v1' }}
          CORPUS_PATH: ${{ github.event.inputs.corpus_path || 'data/training.txt' }}
          TRAINING_STEPS: ${{ github.event.inputs.training_steps || '1000' }}
        run: |
          python scripts/build_and_publish.py \
            --corpus "$CORPUS_PATH" \
            --repo-id "$HF_TARGET_REPO" \
            --output-dir artifacts/aries-core-v1 \
            --steps "$TRAINING_STEPS"

      - name: Independently download the public model and verify generation
        if: success()
        env:
          HF_TARGET_REPO: ${{ github.event.inputs.hf_repo_id || 'PaulMallin/aries-core-v1' }}
        run: |
          python benchmarks/verify_hf_model.py "$HF_TARGET_REPO" --max-new-tokens 16

      - name: Upload model and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aries-model-training-publish-evidence
          path: |
            artifacts/aries-core-v1/
          if-no-files-found: ignore
          retention-days: 30

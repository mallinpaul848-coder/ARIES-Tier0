name: ARIES Full Model Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"
  push:
    branches: [main]
    paths:
      - "published/aries-core-v1/**"
      - "tests/**"
      - "software/**"
      - "tools/aries_bench.py"
      - "tools/aries_latency_bench.py"
      - "validation/aries_model_validation.py"
      - "validation/README.md"
      - ".github/workflows/aries-full-model-validation.yml"

permissions:
  contents: read

jobs:
  software-regression:
    name: Software and deterministic-path regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run repository tests
        run: |
          python -m pytest -q
      - name: Measure deterministic fast path (not model generation)
        run: |
          mkdir -p validation-results
          python tools/aries_latency_bench.py --iterations 20000 --output validation-results/latency-fast-path.json
      - name: Upload software validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aries-software-validation-${{ github.run_id }}
          path: validation-results/
          if-no-files-found: warn
          retention-days: 90

  checkpoint-validation:
    name: Checkpoint loading and full HellaSwag evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install model evaluator
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.2,<2.7" "transformers>=4.45,<5" "safetensors>=0.4" "lm-eval[hf]>=0.4.8"
      - name: Validate config, tokenizer, weights and deterministic generation
        run: |
          mkdir -p validation-results
          python - <<'PY'
          import json, time, traceback
          from pathlib import Path
          from datetime import datetime, timezone
          report = {
              "project": "ARIES Tier 0",
              "validation": "checkpoint_integrity_and_generation",
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "checkpoint": "published/aries-core-v1",
              "status": "failed"
          }
          started = time.perf_counter()
          try:
              from transformers import AutoConfig, AutoTokenizer, AutoModelForCausalLM
              path = "published/aries-core-v1"
              config = AutoConfig.from_pretrained(path, local_files_only=True)
              tokenizer = AutoTokenizer.from_pretrained(path, local_files_only=True)
              model = AutoModelForCausalLM.from_pretrained(path, local_files_only=True)
              model.eval()
              inputs = tokenizer("ARIES validation prompt:", return_tensors="pt")
              import torch
              with torch.inference_mode():
                  first = model.generate(**inputs, max_new_tokens=24, do_sample=False)
                  second = model.generate(**inputs, max_new_tokens=24, do_sample=False)
              text1 = tokenizer.decode(first[0], skip_special_tokens=True)
              text2 = tokenizer.decode(second[0], skip_special_tokens=True)
              params = sum(p.numel() for p in model.parameters())
              report.update({
                  "status": "passed" if text1.strip() and first.tolist() == second.tolist() else "failed",
                  "model_type": getattr(config, "model_type", None),
                  "architectures": getattr(config, "architectures", None),
                  "parameter_count": params,
                  "tokenizer_vocab_size": len(tokenizer),
                  "deterministic_greedy_generation": first.tolist() == second.tolist(),
                  "generated_text_present": bool(text1.strip()),
                  "generated_text_sample": text1[:300],
                  "elapsed_seconds": round(time.perf_counter() - started, 3)
              })
              if report["status"] != "passed":
                  report["error"] = "Generation was empty or deterministic greedy outputs differed."
          except Exception as exc:
              report.update({"status":"failed","error":str(exc),"traceback":traceback.format_exc()[-5000:]})
          Path("validation-results/checkpoint-validation.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          if report["status"] != "passed":
              raise SystemExit(1)
          PY
      - name: Run full HellaSwag validation set
        run: |
          lm-eval run \
            --model hf \
            --model_args pretrained=published/aries-core-v1,dtype=float32 \
            --tasks hellaswag \
            --batch_size 8 \
            --device cpu \
            --output_path validation-results/hellaswag-full.json
      - name: Record benchmark interpretation
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          Path("validation-results/validation-scope.json").write_text(json.dumps({
              "project": "ARIES Tier 0",
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "intended_standard_evaluation": "full HellaSwag test split via lm-evaluation-harness",
              "official_leaderboard_result": False,
              "limitations": [
                "This evaluates the small experimental Transformer checkpoint, not the separate public n-gram endpoint.",
                "A full HellaSwag score is one benchmark and is not a general intelligence score.",
                "No score or ranking is valid unless the workflow completed and the raw evaluator result is available.",
                "The deterministic fast-path timing report is not model inference latency."
              ]
          }, indent=2) + "\n")
          PY
      - name: Upload checkpoint and benchmark reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aries-full-model-validation-${{ github.run_id }}
          path: validation-results/
          if-no-files-found: warn
          retention-days: 90

  public-endpoint:
    name: Public API integration and diagnostic suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Measure public endpoint and run 10-case diagnostic
        env:
          ARIES_BASE_URL: https://aries-tier0-api-6qjh.onrender.com
          ARIES_MODEL_ID: aries-native-ngram
        run: |
          mkdir -p validation-results
          python tools/aries_bench.py --base-url "$ARIES_BASE_URL" --model "$ARIES_MODEL_ID" --limit 10 --output validation-results/public-endpoint-diagnostic.json
      - name: Upload public endpoint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aries-public-endpoint-validation-${{ github.run_id }}
          path: validation-results/public-endpoint-diagnostic.json
          if-no-files-found: warn
          retention-days: 90

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090516">
<title>MALLIN AI — Tier Zero</title>
<style>
:root{color-scheme:dark;--bg:#090516;--panel:rgba(18,12,38,.82);--line:rgba(195,151,255,.24);--violet:#b987ff;--cyan:#78e8ff;--text:#f5efff;--muted:#bcb0d4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 70% 40%,rgba(112,41,179,.35),transparent 45%),radial-gradient(ellipse at 25% 20%,rgba(33,65,155,.3),transparent 40%),linear-gradient(140deg,#070412,#160b2b 55%,#050713);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:-1}
body:before{background:repeating-radial-gradient(ellipse at 53% 48%,transparent 0 24px,rgba(183,119,255,.12) 25px 27px,transparent 29px 45px);transform:rotate(-24deg) scale(1.3);filter:blur(1px);animation:drift 70s linear infinite}
body:after{background-image:radial-gradient(2px 2px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 70% 18%,#d9c5ff,transparent),radial-gradient(2px 2px at 85% 72%,#fff,transparent),radial-gradient(1px 1px at 30% 80%,#8de9ff,transparent),radial-gradient(1px 1px at 55% 57%,#fff,transparent);background-size:220px 180px;opacity:.8}
@keyframes drift{to{transform:rotate(336deg) scale(1.3)}}header{max-width:1000px;margin:auto;padding:26px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;letter-spacing:.13em}.brand span{color:var(--violet)}.status{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:7px 11px}main{max-width:900px;margin:4vh auto 40px;padding:0 18px}.hero{text-align:center;margin-bottom:24px}.hero h1{font-size:clamp(32px,7vw,58px);line-height:1.08;letter-spacing:-.04em;margin:0 0 12px}.hero h1 em{font-style:normal;color:var(--violet)}.hero p{color:var(--muted);margin:0}.chat{border:1px solid var(--line);border-radius:22px;background:var(--panel);backdrop-filter:blur(18px);box-shadow:0 20px 90px #0007;overflow:hidden}.messages{height:min(48vh,490px);min-height:280px;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}.message{max-width:88%;padding:12px 15px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere}.assistant{align-self:flex-start;background:#ffffff0b;border:1px solid #ffffff12}.user{align-self:flex-end;background:#6842a8a8;border:1px solid #c69aff45}.composer{border-top:1px solid var(--line);padding:14px;display:flex;gap:10px;align-items:end}.composer textarea{flex:1;resize:vertical;min-height:50px;max-height:180px;background:#080512bd;border:1px solid var(--line);border-radius:13px;padding:13px;color:var(--text);font:inherit;outline:none}.composer textarea:focus{border-color:var(--violet)}button{border:0;border-radius:12px;padding:13px 17px;background:linear-gradient(135deg,#b47aff,#7b65ff);color:#10091d;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.tools{padding:0 14px 14px;display:flex;gap:9px;flex-wrap:wrap}.tools button{background:#ffffff0b;color:var(--muted);border:1px solid var(--line);font-weight:500;padding:8px 11px}.note{text-align:center;color:#9f93b9;font-size:12px;margin-top:16px}.error{color:#ffb6c1}
@media(max-width:520px){header{padding:18px 14px}.messages{padding:13px}.message{max-width:96%}.composer{padding:10px}.composer button{padding:12px}}
@media(prefers-reduced-motion:reduce){body:before{animation:none}}
</style>
</head>
<body>
<header><div class="brand"><span>✦</span> MALLIN AI <span>// TIER ZERO</span></div><div id="status" class="status">Checking model…</div></header>
<main><section class="hero"><h1>Intelligence, <em>in motion.</em></h1><p>Your MALLIN AI workspace.</p></section>
<section class="chat" aria-label="MALLIN AI chat"><div id="messages" class="messages" aria-live="polite"><div class="message assistant">Welcome to MALLIN AI. Ask a question to begin.</div></div><form id="form" class="composer"><textarea id="prompt" placeholder="Ask MALLIN AI anything…" aria-label="Message" required></textarea><button id="send" type="submit">Send ↗</button></form><div class="tools"><button id="check" type="button">Check model</button><button id="voice" type="button">Voice input</button><button id="speak" type="button">Read replies: off</button><button id="clear" type="button">Clear chat</button></div></section><p class="note">MALLIN AI chat interface. Model readiness is checked against the inference service.</p></main>
<script>
// Same-origin by default: self-hosted ARIES never silently routes prompts to a hosted provider.\nwindow.MALLIN_API_BASE = (window.MALLIN_API_BASE || window.location.origin).replace(/\/$/,"");
const $=s=>document.querySelector(s), messages=$("#messages"), promptBox=$("#prompt"), send=$("#send"), status=$("#status");
let history=[], speakReplies=false;
function addMessage(role,text,cls=role){const el=document.createElement("div");el.className="message "+cls;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el}
async function check(){status.textContent="Checking model…";try{const r=await fetch(window.MALLIN_API_BASE+"/diagnostics",{signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();if(d.general_chat_ready===true){status.textContent="General chat ready"}else{status.textContent="Model not loaded — tasks only"}}catch(e){status.textContent="Inference service unavailable"}}
$("#check").addEventListener("click",check);
$("#clear").addEventListener("click",()=>{history=[];messages.replaceChildren();addMessage("assistant","Chat cleared.");});
$("#speak").addEventListener("click",()=>{speakReplies=!speakReplies;$("#speak").textContent="Read replies: "+(speakReplies?"on":"off");if(!speakReplies&&"speechSynthesis"in window)speechSynthesis.cancel();});
$("#voice").addEventListener("click",()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){addMessage("assistant","Voice input is not supported in this browser. Try Chrome on Android or desktop.");return}const rec=new SR();rec.lang=navigator.language||"en-US";rec.onresult=e=>{promptBox.value=e.results[0][0].transcript;promptBox.focus()};rec.onerror=()=>addMessage("assistant","Microphone access failed. Check browser microphone permission.");rec.start();});
$("#form").addEventListener("submit",async e=>{e.preventDefault();const text=promptBox.value.trim();if(!text)return;addMessage("user",text);promptBox.value="";history.push({role:"user",content:text});send.disabled=true;const pending=addMessage("assistant","Thinking…");
try{const r=await fetch(window.MALLIN_API_BASE+"/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"aries-native",messages:history,max_tokens:512,temperature:.3}),signal:AbortSignal.timeout(120000)});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.detail||data.error?.message||("HTTP "+r.status));const answer=data.choices?.[0]?.message?.content;if(typeof answer!=="string"||!answer.trim())throw Error("The API returned no answer.");pending.textContent=answer;history.push({role:"assistant",content:answer});if(speakReplies&&"speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(answer))}}catch(err){pending.classList.add("error");pending.textContent="Could not get an answer: "+err.message+"\nCheck the inference service or model runtime.";history.pop()}finally{send.disabled=false;messages.scrollTop=messages.scrollHeight;promptBox.focus()}});
promptBox.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#form").requestSubmit()}});
check();
</script></body></html>

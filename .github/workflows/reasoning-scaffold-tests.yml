name: ARIES Reasoning Scaffold Tests

on:
  push:
    branches: [main, "feature/positive-impact-math"]
    paths:
      - "aries_math/reasoning_engine.py"
      - "tests/test_reasoning_engine.py"
      - ".github/workflows/reasoning-scaffold-tests.yml"
  pull_request:
    paths:
      - "aries_math/reasoning_engine.py"
      - "tests/test_reasoning_engine.py"
      - ".github/workflows/reasoning-scaffold-tests.yml"

permissions:
  contents: read

jobs:
  reasoning-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reasoning scaffold tests
        run: python -m unittest discover -s tests -p "test_reasoning_engine.py" -v

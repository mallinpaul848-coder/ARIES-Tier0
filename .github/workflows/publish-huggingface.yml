name: Publish ARIES checkpoint to Hugging Face

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: "Optional Hugging Face namespace/model name. Leave blank to use the token owner's namespace."
        required: false
        default: ""
        type: string
      private:
        description: "Create the Hugging Face model repository as private (recommended until data rights are cleared)"
        required: true
        default: true
        type: boolean
      confirm_corpus_rights:
        description: "Confirm that the training corpus license, attribution, and redistribution rights have been reviewed and permit public release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Block public release until data rights are confirmed
        env:
          HF_PRIVATE: ${{ inputs.private }}
          HF_RIGHTS_CONFIRMED: ${{ inputs.confirm_corpus_rights }}
        run: |
          if [ "$HF_PRIVATE" != "true" ] && [ "$HF_RIGHTS_CONFIRMED" != "true" ]; then
            echo "::error::Public upload blocked. Review training corpus license/attribution and explicitly confirm the rights input, or publish privately."
            exit 1
          fi
          echo "Release-safety gate passed."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check token and resolve destination repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID_INPUT: ${{ inputs.repo_id }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Missing HF_TOKEN. Add a valid Hugging Face write token in GitHub Actions repository secrets."; exit 1; }
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ.get("HF_REPO_ID_INPUT", "").strip()
          if not repo_id:
              user = api.whoami()
              namespace = user.get("name") or user.get("fullname")
              if not namespace:
                  raise SystemExit("Could not determine the Hugging Face token owner's namespace.")
              repo_id = f"{namespace}/aries-core-v1"
          if repo_id.count("/") != 1 or any(not part for part in repo_id.split("/")):
              raise SystemExit("repo_id must be in namespace/model-name format")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"HF_REPO_ID={repo_id}\n")
          print(f"Destination repository: https://huggingface.co/{repo_id}")
          PY

      - name: Install publishing and model verification dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch avoids downloading CUDA libraries on GitHub-hosted runners.
          python -m pip install "torch>=2.2,<2.7" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir "huggingface_hub>=0.27" "transformers>=4.45,<5" "safetensors>=0.4"
          python -m pip cache purge

      - name: Validate local checkpoint before any upload
        run: |
          python - <<'PY'
          from pathlib import Path
          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          folder = Path("published/aries-core-v1")
          required = [
              "config.json", "model.safetensors", "tokenizer.json",
              "tokenizer_config.json", "README.md",
          ]
          missing = [name for name in required if not (folder / name).is_file()]
          if missing:
              raise SystemExit(f"Checkpoint is incomplete; missing: {', '.join(missing)}")

          tokenizer = AutoTokenizer.from_pretrained(folder, local_files_only=True)
          model = AutoModelForCausalLM.from_pretrained(
              folder, local_files_only=True, use_safetensors=True
          )
          model.eval()
          input_ids = tokenizer("ARIES checkpoint verification", return_tensors="pt")["input_ids"]
          if input_ids.numel() == 0:
              raise SystemExit("Tokenizer returned no input tokens")
          with torch.inference_mode():
              output = model.generate(input_ids, max_new_tokens=4, do_sample=False)
          if output.shape[0] != 1 or output.shape[1] < input_ids.shape[1]:
              raise SystemExit("Checkpoint generation sanity check failed")
          print(f"Checkpoint load and generation passed; parameters={sum(p.numel() for p in model.parameters()):,}")
          PY

      - name: Create or confirm model repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_PRIVATE: ${{ inputs.private }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ["HF_REPO_ID"]
          private = os.environ.get("HF_PRIVATE", "true").lower() == "true"
          api.create_repo(repo_id=repo_id, repo_type="model", private=private, exist_ok=True)
          print(f"Repository is ready: https://huggingface.co/{repo_id}")
          PY

      - name: Upload model configuration, weights, tokenizer, and model card
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              repo_id=os.environ["HF_REPO_ID"],
              repo_type="model",
              folder_path="published/aries-core-v1",
              commit_message="Publish ARIES Core v1 experimental checkpoint and model card",
              ignore_patterns=["*.log", "*.tmp", ".DS_Store"],
          )
          print("Upload completed.")
          PY

      - name: Verify repository is public and model loads and generates
        if: ${{ !inputs.private }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python benchmarks/verify_hf_model.py "$HF_REPO_ID" --max-new-tokens 16

      - name: Explain private repository verification status
        if: ${{ inputs.private }}
        run: echo "Upload completed to a private repository. Public-download verification was skipped by request."

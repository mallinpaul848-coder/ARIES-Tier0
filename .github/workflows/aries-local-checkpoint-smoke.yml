# Reproducible project-run checkpoint smoke test; not third-party certification.
name: ARIES Local Checkpoint Reproducibility Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "published/aries-core-v1/**"
      - ".github/workflows/aries-local-checkpoint-smoke.yml"

permissions:
  contents: read

jobs:
  verify-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install --upgrade "torch>=2.2,<3.0" "transformers>=4.40,<5" safetensors
      - name: Verify local config, tokenizer, weights, and deterministic generation
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import hashlib, json, pathlib, platform, sys, time
          import torch
          import transformers
          from transformers import AutoConfig, AutoModelForCausalLM, AutoTokenizer

          root = pathlib.Path("published/aries-core-v1")
          required = ["config.json", "tokenizer.json", "model.safetensors"]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"FAIL: missing required checkpoint files: {missing}")

          hashes = {}
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  digest = hashlib.sha256()
                  with path.open("rb") as stream:
                      for block in iter(lambda: stream.read(1024 * 1024), b""):
                          digest.update(block)
                  hashes[str(path)] = digest.hexdigest()

          config = AutoConfig.from_pretrained(str(root), local_files_only=True)
          tokenizer = AutoTokenizer.from_pretrained(str(root), local_files_only=True)
          model = AutoModelForCausalLM.from_pretrained(
              str(root), local_files_only=True, use_safetensors=True
          )
          model.eval()
          count = sum(p.numel() for p in model.parameters())
          encoded = tokenizer("ARIES checkpoint verification", return_tensors="pt")
          started = time.perf_counter()
          with torch.inference_mode():
              output = model.generate(
                  **encoded, max_new_tokens=8, do_sample=False,
                  pad_token_id=(tokenizer.pad_token_id if tokenizer.pad_token_id is not None
                                else tokenizer.eos_token_id)
              )
          elapsed_ms = (time.perf_counter() - started) * 1000
          new_tokens = int(output.shape[1] - encoded["input_ids"].shape[1])
          if new_tokens < 1:
              raise SystemExit("FAIL: generation returned no new tokens")

          report = {
              "status": "PASS",
              "scope": "project-run packaging and generation smoke test; not independent validation",
              "python": sys.version,
              "platform": platform.platform(),
              "torch_version": torch.__version__,
              "transformers_version": transformers.__version__,
              "model_type": getattr(config, "model_type", None),
              "model_class": model.__class__.__name__,
              "tokenizer_class": tokenizer.__class__.__name__,
              "parameter_count": count,
              "prompt": "ARIES checkpoint verification",
              "new_tokens_generated": new_tokens,
              "generation_elapsed_ms": round(elapsed_ms, 3),
              "generation_elapsed_ms_note": "single GitHub-hosted CPU smoke sample; not a performance claim",
              "decoded_output": tokenizer.decode(output[0], skip_special_tokens=True),
              "sha256": hashes,
          }
          pathlib.Path("artifacts/aries-local-checkpoint-smoke.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, indent=2))
          PY
      - name: Upload reproducibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aries-local-checkpoint-smoke-${{ github.run_id }}
          path: artifacts/aries-local-checkpoint-smoke.json
          if-no-files-found: warn
          retention-days: 90

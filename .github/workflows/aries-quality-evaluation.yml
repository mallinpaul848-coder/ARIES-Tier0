name: ARIES Held-Out Quality Evaluation

on:
  pull_request:
    paths:
      - "training/aries_quality_eval.py"
      - "training/aries_trillion_token_trainer.py"
      - ".github/workflows/aries-quality-evaluation.yml"
  workflow_dispatch:
    inputs:
      checkpoint_path:
        description: Absolute path to a compatible checkpoint on the self-hosted runner
        required: true
        type: string
      validation_corpus_path:
        description: Absolute path to a separate licensed validation corpus on the runner
        required: true
        type: string
      max_batches:
        description: Maximum held-out batches (0 evaluates all available batches)
        required: true
        default: "100"
        type: string

permissions:
  contents: read

jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile evaluation harness
        run: python -m py_compile training/aries_quality_eval.py training/aries_trillion_token_trainer.py

  evaluate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install evaluation dependency
        run: python -m pip install "torch>=2.2,<3.0"
      - name: Run held-out evaluation
        env:
          CHECKPOINT_PATH: ${{ inputs.checkpoint_path }}
          VALIDATION_CORPUS_PATH: ${{ inputs.validation_corpus_path }}
          MAX_BATCHES: ${{ inputs.max_batches }}
        run: |
          set -euo pipefail
          python training/aries_quality_eval.py \
            --checkpoint "$CHECKPOINT_PATH" \
            --validation-corpus "$VALIDATION_CORPUS_PATH" \
            --max-batches "$MAX_BATCHES" \
            --output artifacts/aries-quality-evaluation.json
      - name: Upload measured evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aries-heldout-quality-evaluation-${{ github.run_id }}
          path: artifacts/aries-quality-evaluation.json
          if-no-files-found: warn
          retention-days: 90

name: ARIES Public Endpoint Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-endpoint-check.yml"
      - "api/main.py"
      - "software/**"
      - "Dockerfile"
      - "render.yaml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  check-public-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for service and validate the implemented API contract
        env:
          ARIES_PUBLIC_BASE_URL: https://aries-tier0-api-6qjh.onrender.com
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          base = os.environ["ARIES_PUBLIC_BASE_URL"].rstrip("/")
          deadline = time.monotonic() + 720
          last_error = "service has not responded yet"

          def request(path, payload=None, timeout=45):
              data = None if payload is None else json.dumps(payload).encode()
              headers = {"Accept": "application/json", "User-Agent": "ARIES-Public-Endpoint-Check/2.0"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=headers,
                  method="GET" if data is None else "POST")
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      raw = response.read().decode("utf-8", "replace")
                      return response.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", "replace")
                  try:
                      body = json.loads(raw) if raw else {}
                  except ValueError:
                      body = {"response_text": raw[:500]}
                  return exc.code, body

          # Free hosted services may sleep. Retry transient failures, but do not
          # require fields or version numbers that the checked-in API doesn't expose.
          while time.monotonic() < deadline:
              try:
                  health_status, health = request("/health", timeout=45)
                  root_status, root = request("/", timeout=45)
                  diag_status, diag = request("/diagnostics", timeout=45)
                  models_status, models = request("/v1/models", timeout=45)
                  if (health_status == 200 and health.get("status") == "ok"
                      and root_status == 200 and root.get("service") == "ARIES AI API"
                      and isinstance(root.get("api_version"), str)
                      and diag_status == 200 and isinstance(diag, dict)
                      and models_status == 200 and models.get("object") == "list"):
                      break
                  last_error = {
                      "health": [health_status, health],
                      "root": [root_status, root],
                      "diagnostics": [diag_status, diag],
                      "models": [models_status, models],
                  }
              except Exception as exc:
                  last_error = type(exc).__name__ + ": " + str(exc)
              print("Waiting for service:", last_error, flush=True)
              time.sleep(15)
          else:
              raise SystemExit("FAIL: API did not satisfy its checked-in contract within 12 minutes. Last result: " + str(last_error))

          report = {"target": base, "api_version": root.get("api_version"), "checks": []}
          for path, status, body in (
              ("/health", health_status, health),
              ("/", root_status, root),
              ("/diagnostics", diag_status, diag),
              ("/v1/models", models_status, models),
          ):
              report["checks"].append({"path": path, "http_status": status, "body": body})
              assert status == 200, f"{path} returned HTTP {status}: {body}"

          # Verify the service's actual chat path. If no general model is configured,
          # deterministic arithmetic is still expected to work as implemented.
          status, chat = request("/v1/chat/completions", {
              "model": "aries",
              "messages": [{"role": "user", "content": "2+2?"}],
              "max_tokens": 16,
              "temperature": 0
          }, timeout=60)
          choices = chat.get("choices", []) if isinstance(chat, dict) else []
          answer = choices[0].get("message", {}).get("content", "") if choices else ""
          report["checks"].append({
              "path": "/v1/chat/completions",
              "http_status": status,
              "nonempty_response": bool(str(answer).strip()),
              "response_preview": str(answer)[:160]
          })
          print(json.dumps(report, indent=2))
          assert status == 200 and str(answer).strip(), f"Chat endpoint failed its deterministic smoke test: {chat}"
          assert "4" in str(answer), f"Arithmetic smoke test did not return 4: {answer}"
          print("PASS: implemented API contract and deterministic chat smoke test.")
          PY
      - name: Run 10-case external diagnostic benchmark
        env:
          ARIES_BASE_URL: https://aries-tier0-api-6qjh.onrender.com
          ARIES_MODEL_ID: aries
        run: |
          mkdir -p reports
          python tools/aries_bench.py --base-url "$ARIES_BASE_URL" --model "$ARIES_MODEL_ID" --limit 10 --output reports/public-benchmark.json
          {
            echo "### ARIES external diagnostic benchmark"
            echo "The attached JSON contains measured request latency and exact-match results for 10 authored diagnostic cases."
            echo "This is not an official leaderboard result or an independent model-quality certification."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measured benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: aries-public-diagnostic-benchmark
          path: reports/public-benchmark.json
          if-no-files-found: error

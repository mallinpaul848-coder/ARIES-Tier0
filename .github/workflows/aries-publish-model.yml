name: ARIES Train, Export, Publish, and Verify Model
on:
  workflow_dispatch:
    inputs:
      hf_repo_id:
        description: "Public Hugging Face model repo ID (namespace/name)"
        required: true
        type: string
      corpus_path:
        description: "Path to a UTF-8 training corpus you own or are licensed to use"
        required: true
        default: "data/training.txt"
        type: string
      training_steps:
        description: "Training steps; this does not guarantee model quality"
        required: true
        default: "1000"
        type: string
permissions:
  contents: read
jobs:
  train-publish-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Check required secret and licensed corpus
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CORPUS_PATH: ${{ inputs.corpus_path }}
          HF_REPO_ID: ${{ inputs.hf_repo_id }}
          TRAINING_STEPS: ${{ inputs.training_steps }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          token = os.environ.get("HF_TOKEN", "")
          if not token:
              raise SystemExit("HF_TOKEN secret is missing. Add it in GitHub Settings > Secrets and variables > Actions. Never put the token in a file or workflow input.")
          repo = os.environ["HF_REPO_ID"].strip()
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*", repo):
              raise SystemExit("HF_REPO_ID must be a namespace/name repository identifier.")
          try:
              steps = int(os.environ["TRAINING_STEPS"])
          except ValueError:
              raise SystemExit("Training steps must be an integer.")
          if not 1 <= steps <= 100000:
              raise SystemExit("Training steps must be between 1 and 100000.")
          p = Path(os.environ["CORPUS_PATH"])
          if not p.is_file():
              raise SystemExit(f"Training corpus not found: {p}. Add a UTF-8 corpus you own or are licensed to use; the pipeline will not substitute demo text silently.")
          s = p.read_text(encoding="utf-8-sig").strip()
          if len(s) < 100_000:
              raise SystemExit(f"Corpus has only {len(s)} characters; at least 100000 are required. A much larger and diverse licensed corpus is needed for meaningful training.")
          print(f"Preflight passed: corpus={p}; characters={len(s)}; steps={steps}; target={repo}. Verify data provenance/license before publishing.")
          PY
      - name: Install CPU training dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<2.7"
          python -m pip install "transformers>=4.45,<5" "tokenizers>=0.20" "huggingface_hub>=0.26" "safetensors>=0.4" "accelerate>=0.26"
      - name: Train, export, locally reload, and publish model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ inputs.hf_repo_id }}
          CORPUS_PATH: ${{ inputs.corpus_path }}
          TRAINING_STEPS: ${{ inputs.training_steps }}
        run: |
          python software/train_and_publish_aries_lm.py \
            --corpus "$CORPUS_PATH" \
            --repo-id "$HF_REPO_ID" \
            --output-dir artifacts/aries-published \
            --steps "$TRAINING_STEPS" \
            --model-name "ARIES Experimental Causal LM"
      - name: Independently download public model and test generation
        env:
          HF_REPO_ID: ${{ inputs.hf_repo_id }}
        run: |
          python benchmarks/verify_hf_model.py "$HF_REPO_ID" --max-new-tokens 16
      - name: Upload training and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aries-training-publish-verification
          path: |
            artifacts/aries-published/README.md
            artifacts/aries-published/config.json
            artifacts/aries-published/model.safetensors
            artifacts/aries-published/tokenizer.json
            artifacts/aries-published/tokenizer_config.json
          if-no-files-found: ignore
          retention-days: 30

name: ARIES RTL External Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rtl-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile RTL and testbench
        run: |
          mkdir -p build
          iverilog -g2012 -Wall -s tb_aries_sub_ns_core -o build/aries_rtl_test src/aries_sub_ns_core.v sim/tb_aries_sub_ns_core.v
      - name: Run smoke tests
        run: vvp build/aries_rtl_test

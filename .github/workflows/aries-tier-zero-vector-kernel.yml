name: ARIES Tier Zero Vector Kernel Benchmark

on:
  push:
    branches: [tier-zero-vector-kernel-benchmark]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile benchmark
        run: gcc -std=c11 -O3 -Wall -Wextra -Werror -pedantic -I. -Imath_core benchmarks/aries_tier0_vector_kernel_bench.c -o /tmp/aries-vector-bench -lm
      - name: Run correctness and latency comparison
        run: /tmp/aries-vector-bench

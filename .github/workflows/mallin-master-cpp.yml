name: Mallin Master Platform C++ Validation

on:
  push:
    paths:
      - "platform/native/**"
      - "tests/cpp/**"
      - ".github/workflows/mallin-master-cpp.yml"
  pull_request:
    paths:
      - "platform/native/**"
      - "tests/cpp/**"
      - ".github/workflows/mallin-master-cpp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp20-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile with strict C++20 warnings
        run: |
          g++ --version
          g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -pthread -I. \
            tests/cpp/test_mallin_master_platform.cpp -o mallin-master-test
      - name: Run functional tests
        run: ./mallin-master-test

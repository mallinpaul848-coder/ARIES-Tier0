name: ARIES Double Helix Scheduler Tests
on:
  push:
    branches: [main, "feature/universal-performance-orchestrator"]
    paths: ["aries_math/double_helix_scheduler.py", "tests/test_double_helix_scheduler.py", ".github/workflows/double-helix-tests.yml"]
  pull_request:
    paths: ["aries_math/double_helix_scheduler.py", "tests/test_double_helix_scheduler.py", ".github/workflows/double-helix-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile aries_math/double_helix_scheduler.py
      - run: python -m unittest discover -s tests -p "test_double_helix_scheduler.py" -v
name: MALLIN Cloud Free Preview

on:
  push:
    branches: [main]
    paths:
      - "mallin-cloud/**"
      - ".github/workflows/mallin-cloud-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mallin-cloud-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static preview
        run: |
          mkdir -p _site
          cp mallin-cloud/index.html _site/index.html
          cat > _site/README.txt <<'EOF'
          MALLIN Cloud visual preview.
          The GitHub Pages preview is the static dashboard only. Deploy APIs and site publishing require a running MALLIN Cloud server.
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: ARIES Secure Publish Existing Checkpoint

on:
  workflow_dispatch:
    inputs:
      hf_repo_id:
        description: "Hugging Face model repository (namespace/name)"
        required: true
        default: "PaulMallin/aries-core-v1"
        type: string
      model_dir:
        description: "Existing trained checkpoint directory in this repository"
        required: true
        default: "published/aries-core-v1"
        type: string
  push:
    branches: ["main"]
    paths:
      - "scripts/publish_clean.py"
      - "scripts/publish_robust.py"
      - ".github/workflows/secure_publish.yml"
      - "published/aries-core-v1/**"

permissions:
  contents: read

jobs:
  secure-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Check out ARIES repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model validation and publishing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.2,<2.7" "transformers>=4.45,<5" "huggingface_hub>=0.26" "safetensors>=0.4"

      - name: Validate existing checkpoint and staged public export
        env:
          ARIES_MODEL_DIR: ${{ inputs.model_dir || 'published/aries-core-v1' }}
        run: python scripts/publish_clean.py --validate-only

      - name: Publish only if Hugging Face write token is configured
        if: ${{ env.HF_TOKEN != '' }}
        env:
          HF_TARGET_REPO: ${{ inputs.hf_repo_id || 'PaulMallin/aries-core-v1' }}
          ARIES_MODEL_DIR: ${{ inputs.model_dir || 'published/aries-core-v1' }}
        run: python scripts/publish_clean.py

      - name: Explain validation-only result when token is missing
        if: ${{ env.HF_TOKEN == '' }}
        run: |
          echo "::warning title=Hugging Face upload skipped::Local checkpoint validation ran, but HF_TOKEN is not configured. Add a Hugging Face write token at Settings > Secrets and variables > Actions > New repository secret, named HF_TOKEN, then rerun this workflow."

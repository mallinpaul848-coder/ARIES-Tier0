name: ARIES Feedback Optimizer Tests
on:
  push:
    branches: [main, "feature/universal-performance-orchestrator"]
    paths: ["aries_math/feedback_optimizer.py", "tests/test_feedback_optimizer.py", ".github/workflows/feedback-optimizer-tests.yml"]
  pull_request:
    paths: ["aries_math/feedback_optimizer.py", "tests/test_feedback_optimizer.py", ".github/workflows/feedback-optimizer-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile aries_math/feedback_optimizer.py
      - run: python -m unittest discover -s tests -p "test_feedback_optimizer.py" -v
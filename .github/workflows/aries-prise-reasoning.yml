name: ARIES PRISE Reasoning Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "benchmarks/prise_reasoning_eval.py"
      - ".github/workflows/aries-prise-reasoning.yml"

permissions:
  contents: read

jobs:
  reasoning-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile evaluation harness
        run: python -m py_compile benchmarks/prise_reasoning_eval.py
      - name: Run PRISE reasoning evaluation against public API
        env:
          ARIES_API_KEY: ${{ secrets.ARIES_CAPABILITY_API_KEY }}
        run: |
          python benchmarks/prise_reasoning_eval.py \
            --base-url https://aries-tier0-api-6qjh.onrender.com \
            --model auto \
            --timeout 60 \
            --output reports/aries-prise-reasoning.json
      - name: Upload reasoning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aries-prise-reasoning-${{ github.run_id }}
          path: reports/aries-prise-reasoning.json
          if-no-files-found: warn
          retention-days: 90

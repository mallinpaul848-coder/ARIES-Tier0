name: ARIES Public Hugging Face Model Verification

on:
  workflow_dispatch:
    inputs:
      model_repo_id:
        description: Public Hugging Face model repository ID (owner/model)
        required: true
        type: string
      revision:
        description: Optional immutable model commit SHA
        required: false
        type: string
      max_new_tokens:
        description: Maximum generated tokens for smoke test (1-128)
        required: true
        default: "16"
        type: string
  pull_request:
    paths:
      - "benchmarks/verify_hf_model.py"
      - ".github/workflows/aries-huggingface-verification.yml"

permissions:
  contents: read

jobs:
  syntax:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile verifier
        run: python -m py_compile benchmarks/verify_hf_model.py

  verify-public-model:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verifier dependencies
        run: python -m pip install "torch>=2.2,<3.0" "transformers>=4.40" "safetensors" "huggingface_hub"
      - name: Verify public model download, load, and generation
        env:
          MODEL_REPO_ID: ${{ inputs.model_repo_id }}
          MODEL_REVISION: ${{ inputs.revision }}
          MAX_NEW_TOKENS: ${{ inputs.max_new_tokens }}
        run: |
          set -euo pipefail
          args=("$MODEL_REPO_ID" --max-new-tokens "$MAX_NEW_TOKENS")
          if [[ -n "$MODEL_REVISION" ]]; then
            args+=(--revision "$MODEL_REVISION")
          fi
          python benchmarks/verify_hf_model.py "${args[@]}" | tee hf-model-verification.txt
      - name: Upload verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aries-huggingface-verification-${{ github.run_id }}
          path: hf-model-verification.txt
          if-no-files-found: warn
          retention-days: 90

name: ARIES End-to-End API Integration Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: python -m pip install -r requirements.txt

      - name: Start deterministic OpenAI-compatible test backend
        run: |
          cat > mock_backend.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/v1/models":
                      body = {"object":"list","data":[{"id":"test-model","object":"model"}]}
                      self.send_response(200)
                      self.send_header("Content-Type","application/json")
                      self.end_headers()
                      self.wfile.write(json.dumps(body).encode())
                      return
                  self.send_error(404)

              def do_POST(self):
                  if self.path != "/v1/chat/completions":
                      self.send_error(404)
                      return
                  length = int(self.headers.get("Content-Length", "0"))
                  payload = json.loads(self.rfile.read(length) or b"{}")
                  body = {
                      "id":"chatcmpl-test",
                      "object":"chat.completion",
                      "choices":[{"index":0,"message":{"role":"assistant","content":"ARIES_EXTERNAL_TEST_OK"},"finish_reason":"stop"}],
                      "model":payload.get("model","test-model")
                  }
                  encoded = json.dumps(body).encode()
                  self.send_response(200)
                  self.send_header("Content-Type","application/json")
                  self.send_header("Content-Length",str(len(encoded)))
                  self.end_headers()
                  self.wfile.write(encoded)

              def log_message(self, *_):
                  pass

          HTTPServer(("127.0.0.1", 8001), Handler).serve_forever()
          PY
          nohup python mock_backend.py > mock-backend.log 2>&1 &
          echo $! > mock-backend.pid

      - name: Start ARIES API proxy
        env:
          ARIES_UPSTREAM_BASE_URL: http://127.0.0.1:8001/v1
          ARIES_MODEL_ID: test-model
          ARIES_UPSTREAM_TIMEOUT_SECONDS: "10"
        run: |
          nohup python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 > aries-api.log 2>&1 &
          echo $! > aries-api.pid
          python - <<'PY'
          import time, urllib.request
          for attempt in range(40):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=1)
                  print("ARIES API started")
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit("ARIES API failed to start")
          PY

      - name: Verify health, readiness, model listing, and real proxy response
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time, urllib.request

          base = "http://127.0.0.1:8000"
          def get(path):
              with urllib.request.urlopen(base + path, timeout=10) as r:
                  return json.load(r)
          def post(path, payload):
              req = urllib.request.Request(
                  base + path,
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type":"application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          assert get("/health")["status"] == "ok"
          root = get("/")
          assert root["inference_ready"] is True, root
          models = get("/v1/models")
          assert models["data"][0]["id"] == "test-model", models
          start = time.perf_counter()
          response = post("/v1/chat/completions", {
              "model":"aries",
              "messages":[{"role":"user","content":"Reply with exactly ARIES_EXTERNAL_TEST_OK"}],
              "max_tokens":32,
              "temperature":0
          })
          latency_ms = (time.perf_counter() - start) * 1000
          answer = response["choices"][0]["message"]["content"]
          assert answer == "ARIES_EXTERNAL_TEST_OK", response
          print("PASS: health endpoint")
          print("PASS: configured readiness")
          print("PASS: model listing")
          print("PASS: request forwarded to OpenAI-compatible backend")
          print("PASS: non-empty response returned through ARIES")
          print(f"Measured local CI proxy round-trip: {latency_ms:.2f} ms")
          print("NOTE: deterministic mock backend; this is not a live-model benchmark.")
          PY

      - name: Publish test scope and result
        if: always()
        run: |
          {
            echo "## ARIES API integration test"
            echo "- Verifies health, configured readiness, model listing, and end-to-end chat proxying."
            echo "- Uses a deterministic mock backend to verify the API integration without private credentials."
            echo "- This does not establish public deployment availability, real-model quality, or public latency."
          } >> "$GITHUB_STEP_SUMMARY"
